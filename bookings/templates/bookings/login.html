{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block start %}
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-6 col-lg-5">
            
            <div class="card shadow-sm border-dark p-4 p-md-5 rounded-3">
                <h2 class="text-center mb-4">Login</h2>
                
                <form method="POST">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        {{ form|crispy }}
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-dark btn-lg py-2 mt-3" style="background-color: #263749;">
                            <i class="bi bi-box-arrow-in-right"></i> Login
                        </button>
                    </div>

                    <div class="text-center mt-4">
                        <small class="text-muted">
                            Don't have an account? 
                            <a href="{% url 'register' %}" class="text-decoration-none fw-bold">Sign up</a>
                        </small>
                    </div>
                </form>
                
            </div>
        </div>
    </div>
</div>
{% endblock start %}
