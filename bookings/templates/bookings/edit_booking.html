{% extends "base.html" %}
{% load static %}
{% load crispy_forms_tags %}
{% block start %}

<div>
  <p> Hello, {{ user.username }}! Edit your Booking here!</p>
</div>

<form method="post">
    {% csrf_token %}
    {{ form | crispy }}
    <button type="submit" class="btn btn-primary">Save Changes</button>
    <a href="{% url 'edit_booking' booking_id=booking.id %}">Cancel</a>
</form>



{% endblock start %}
