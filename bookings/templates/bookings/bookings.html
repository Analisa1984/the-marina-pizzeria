{% extends "base.html" %}
{% load static %}
{% load crispy_forms_tags %}

{% block start %}
<div class="container py-5">
    <div class="text-center mb-5">
        <h1 class="display-5 fw-bold">Ready for Pizza, {{ user.username }}?</h1>
        <p class="text-muted">Reserve your table at The Marina Pizzeria below.</p>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            
            <div class="card shadow border-0 rounded-4">
                <div class="card-body p-4 p-md-5">
                    
                    <form method="POST">
                        {% csrf_token %}
                        
                        <div class="mb-4">
                            {{ form_booking|crispy }}
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success btn-lg py-3 fw-bold shadow-sm">
                                <i class="bi bi-calendar-check-fill me-2"></i> Book Now
                            </button>
                        </div>

                        <div class="text-center mt-4">
                            <hr class="text-muted">
                            <small>
                                <a href="{% url 'login' %}" class="text-decoration-none text-primary fw-semibold">
                                    Need to manage existing bookings? Login here
                                </a>
                            </small>
                        </div>
                    </form>
                    
                </div>
            </div>

        </div>
    </div>
</div>
{% endblock start %}
