{% extends "base.html" %}
{% load static %}
{% load crispy_forms_tags %}
{% block start %}

<div>
  <p> Hello, {{ user.username }}! Bookings page</p>
</div>
<!-- Booking Form for The Marina Pizzeria -->
<div>
    <div class="content-section col-md-8 col-md-offset-2">
  <form method="POST" style="border: 1px solid black; margin: 4%; padding:10%; border-radius:1%;">
    {{ form_booking | crispy }}
    {% csrf_token %}
    <center>
      <button style="background: green; padding:2%; font-size: 2rem; color:white;" class="btn btn-outline-info" type="submit">   Book Now</button>
    </center>
    <br />
    <sub><a href="{% url "login" %}" style="text-decoration: none; color: blue; padding:3%; cursor:pointer;">Already have an account ?</a></sub>
  </form>
</div>
</div>
{% endblock start %}
